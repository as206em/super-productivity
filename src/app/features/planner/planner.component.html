<!-- Page headline, the same shape the list views carry: what you are looking
     at, then one quiet meta line. -->
<header class="planner-toolbar">
  <span class="planner-toolbar__title">{{ rangeLabel() }}</span>
  @if (rangeMeta(); as meta) {
    <span class="planner-toolbar__meta">{{ meta }}</span>
  }
</header>

@if (layoutService.isXs()) {
  <planner-calendar-nav
    [visibleDayDate]="planView.visibleDayDate()"
    [daysWithTasks]="daysWithTasks()"
    (dayTapped)="planView.scrollToDay($event)"
  />
}
<planner-plan-view
  #planView
  cdkDropListGroup
  cdkScrollable
/>
